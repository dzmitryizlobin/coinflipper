<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e7eef4">
<title>Монетный Двор — идл про монетки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1f4a; --ink2:#1b1530;
  --purple:#8b5cf6; --purpleD:#5b2fc9; --purpleL:#b794ff;
  --blue:#29a8ec; --blueD:#1170b0;
  --orange:#f08a24; --orangeD:#a8520a;
  --green:#3cc46a; --greenD:#1f8a44;
  --panel:#24233a; --panelD:#16152a; --panelL:#34334f;
  --gold:#ffcc33; --goldD:#c98a00;
  --bg:#dbe5ee;
  --safe-top: max(env(safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px));
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --font: 'Rubik', 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:#fff;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ol{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 3px 0 var(--ink)}
.ol-s{text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink),0 2px 0 var(--ink)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;overflow:hidden;
  padding-top:var(--safe-top);transition:background .8s}
#stage{position:relative;flex:1;min-height:0;z-index:1;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:0}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;padding:8px 10px 0}
#hud .row1{display:flex;align-items:center;gap:8px}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;transition:transform .08s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(42,31,74,.55))}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#ff3b5c;border:2px solid #fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 0 var(--ink)}
.badge:empty{display:none}
#lvlbox{flex:1;display:flex;align-items:center;position:relative;height:40px;pointer-events:auto}
#lvlstar{position:absolute;left:-4px;top:-6px;width:52px;height:52px;z-index:2;display:grid;place-items:center}
#lvlstar svg{position:absolute;inset:0;width:100%;height:100%}
#lvlnum{position:relative;font-weight:900;font-size:19px;margin-top:3px}
#xpbar{flex:1;margin-left:24px;height:24px;border-radius:12px;background:var(--panel);border:3px solid var(--ink);overflow:hidden;position:relative;box-shadow:0 3px 0 rgba(42,31,74,.35)}
#xpfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#c3a3ff,#8b5cf6 55%,#6d3fe0);border-radius:0 10px 10px 0;transition:width .25s}
#xptext{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;padding-left:20px}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;height:30px;border-radius:15px;background:var(--panel);border:3px solid var(--ink);padding:0 10px 0 4px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(42,31,74,.35)}
.pill svg{width:22px;height:22px}
.pill .plus{width:18px;height:18px;border-radius:6px;background:var(--green);display:grid;place-items:center;font-weight:900;font-size:15px;margin-left:2px;box-shadow:0 2px 0 var(--greenD)}
#money{margin:8px auto 0;width:min(78%,330px);border-radius:18px;background:linear-gradient(var(--panelL),var(--panel) 40%,var(--panelD));border:3px solid var(--ink);
  box-shadow:0 4px 0 rgba(42,31,74,.45), inset 0 2px 0 rgba(255,255,255,.08);padding:6px 14px 6px;text-align:center;position:relative}
#money .amt{display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:900;line-height:1.05;letter-spacing:.5px}
#money .amt canvas{width:36px;height:36px}
#money .ps{font-size:15px;font-weight:800;color:#d9d4ff;margin-top:1px}
#boosts{display:flex;justify-content:center;gap:4px 6px;margin:6px auto 0;flex-wrap:wrap;max-width:calc(100% - 170px)}
.chip{pointer-events:auto;font-size:12px;font-weight:800;padding:3px 8px;border-radius:10px;background:var(--orange);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.chip.frenzy{background:linear-gradient(90deg,#ff5fa2,#ffb13b,#5fe0ff,#a66cff);background-size:300% 100%;animation:rainbow 1.2s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
#sideL,#sideR{position:absolute;top:118px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#sideL{left:8px}
#sideR{right:8px;align-items:flex-end}
.sidebtn{pointer-events:auto;width:52px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;transition:transform .08s}
.sidebtn:active{transform:scale(.9)}
.sidebtn svg{width:42px;height:42px;filter:drop-shadow(0 3px 0 rgba(42,31,74,.5))}
.sidebtn span{font-size:10px;font-weight:900;margin-top:-4px}
.sidebtn.hidden{display:none}
.sidebtn.wiggle svg{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}92%{transform:rotate(-5deg)}}
#pig{width:76px}
#pig svg{width:70px;height:58px}

/* ---------- Bottom controls ---------- */
#controls{position:relative;z-index:2;pointer-events:none;padding:4px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
#zonepill{pointer-events:auto;box-shadow:0 2px 0 rgba(42,31,74,.25);display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.82);color:var(--ink);font-weight:900;font-size:14px;letter-spacing:.3px;position:relative;overflow:hidden;min-width:190px;justify-content:center}
#zonepill .zfill{position:absolute;left:0;top:0;bottom:0;background:rgba(139,92,246,.28);width:0;transition:width .3s}
#zonepill b{position:relative}
#zonepill.ready{background:var(--green);color:#fff;animation:pulse 1s ease-in-out infinite;box-shadow:0 3px 0 var(--greenD)}
#zonepill.ready b{text-shadow:0 1px 0 var(--greenD)}
@keyframes pulse{50%{transform:scale(1.05)}}
#actions{display:flex;align-items:stretch;gap:8px;width:100%}
.abtn{pointer-events:auto;flex:0 0 26%;border-radius:16px;background:linear-gradient(#a57bff,var(--purple) 60%,#7444e8);border:3px solid var(--ink);box-shadow:0 5px 0 var(--purpleD),0 6px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px 5px;position:relative;transition:transform .06s, box-shadow .06s;min-height:74px}
.abtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--purpleD),0 2px 0 var(--ink)}
.abtn svg,.abtn canvas{width:40px;height:40px}
.abtn .t{font-size:15px;font-weight:900;line-height:1}
.abtn .p{font-size:12px;font-weight:800;display:flex;align-items:center;gap:3px;margin-top:2px}
.abtn .p canvas{width:14px;height:14px}
.abtn:disabled{filter:grayscale(.55) brightness(.9)}
.abtn.locked{filter:grayscale(1) brightness(.85)}
.abtn .lockcap{position:absolute;inset:0;display:none;place-items:center;font-size:12px;font-weight:900;border-radius:13px;background:rgba(30,25,50,.55)}
.abtn.locked .lockcap{display:grid}
#buywrap{pointer-events:auto;flex:1;display:flex;flex-direction:column;align-items:stretch;gap:0}
#buy{flex:1;border-radius:16px;background:linear-gradient(#5cc8ff,var(--blue) 55%,#1a8fd6);border:3px solid var(--ink);box-shadow:0 5px 0 var(--blueD),0 6px 0 var(--ink);
  display:flex;align-items:center;gap:8px;padding:6px 10px;transition:transform .06s, box-shadow .06s;min-height:60px}
#buy:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--blueD),0 2px 0 var(--ink)}
#buy:disabled{filter:grayscale(.5) brightness(.92)}
#buy canvas{width:46px;height:46px;flex:0 0 auto}
#buy .bt{flex:1;text-align:center}
#buy .t{font-size:16px;font-weight:900;line-height:1.1}
#buy .p{font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px}
#buy .p canvas{width:22px;height:22px}
#buy.full .t{font-size:14px}
#qty{display:flex;align-self:center;margin-top:-3px;border-radius:0 0 10px 10px;overflow:hidden;border:3px solid var(--ink);border-top:0;box-shadow:0 3px 0 var(--ink)}
#qty button{width:58px;height:24px;font-size:13px;font-weight:900;background:var(--orangeD);color:#f6c99a}
#qty button.on{background:var(--orange);color:#fff}
#nav{position:relative;z-index:30;display:flex;gap:4px;padding:6px 6px calc(6px + var(--safe-bot));background:var(--panelD);border-top:3px solid var(--ink)}
.nb{flex:1;height:64px;border-radius:12px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:transform .06s}
.nb:active{transform:scale(.95)}
.nb svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.nb span{font-size:11px;font-weight:900}
.nb.on{background:linear-gradient(#a57bff,var(--purple));box-shadow:inset 0 -3px 0 var(--purpleD)}
.nb.center{flex:1.25}
.nb.center svg{width:40px;height:40px}
.nb.locked svg{opacity:.35}
.nb.locked span{opacity:.6}
.nb .lk{display:none;position:absolute;top:8px;width:22px;height:22px}
.nb.locked .lk{display:block}

/* ---------- Sheets ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;top:22%;background:var(--panelD);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;z-index:20;box-shadow:0 -8px 30px rgba(20,15,40,.35)}
#sheet{visibility:hidden;pointer-events:none}
#sheet.open{transform:translateY(0);visibility:visible;pointer-events:auto}
#sheet .sh-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
#sheet .sh-head h2{flex:1;margin:0;font-size:22px;font-weight:900}
#sheet .close{width:38px;height:38px;border-radius:12px;background:var(--panel);font-size:20px;font-weight:900;border:2px solid var(--ink)}
#sheet .sh-body{flex:1;overflow-y:auto;padding:4px 12px calc(16px + var(--safe-bot));-webkit-overflow-scrolling:touch}
.sec{font-size:13px;font-weight:800;color:#aaa6d6;margin:14px 4px 6px}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:9px;margin-bottom:8px;border:2px solid #0f0e1f;box-shadow:inset 0 2px 0 rgba(255,255,255,.05)}
.card .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:0 0 auto;background:linear-gradient(#4a4870,#34334f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.card .ic canvas{width:40px;height:40px}
.card .mid{flex:1;min-width:0}
.card .nm{font-size:15px;font-weight:900;display:flex;align-items:baseline;gap:0 6px;flex-wrap:wrap}
.card .nm small{font-size:11px;font-weight:800;color:#aaa6d6;white-space:nowrap}
.card .ds{font-size:12px;font-weight:600;color:#c9c5ee;margin-top:2px;line-height:1.3}
.card .fx{font-size:12px;font-weight:800;color:#8ee8a8;margin-top:2px}
.buyb{min-width:92px;height:44px;border-radius:12px;background:linear-gradient(#5be38a,var(--green));border:2px solid var(--ink);box-shadow:0 4px 0 var(--greenD);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;transition:transform .06s}
.buyb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--greenD)}
.buyb:disabled{background:#4a4866;box-shadow:0 4px 0 #2b2a40;color:#b5b2d4}
.buyb canvas{width:16px;height:16px}
.buyb.blue{background:linear-gradient(#5cc8ff,var(--blue));box-shadow:0 4px 0 var(--blueD)}
.buyb.gold{background:linear-gradient(#ffe16b,#f5b400);box-shadow:0 4px 0 var(--goldD);color:var(--ink2)}
.buyb.max{background:#3a3956;box-shadow:none;color:#9b98c2}
.empty{color:#aaa6d6;font-size:13px;text-align:center;padding:20px}

.hero{border-radius:18px;padding:14px;margin:4px 0 10px;text-align:center;background:radial-gradient(circle at 50% 0,#4b3a8a,#26214a 70%);border:2px solid #0f0e1f}
.hero h3{margin:6px 0 4px;font-size:20px;font-weight:900}
.hero p{margin:4px 0;font-size:13px;color:#d5d0ff;font-weight:600;line-height:1.35}
.hero .big{font-size:30px;font-weight:900;color:var(--gold)}
.bigbtn{width:100%;height:54px;border-radius:16px;font-size:18px;font-weight:900;border:3px solid var(--ink);margin-top:10px;background:linear-gradient(#ff8fb8,#ff4d8a);box-shadow:0 5px 0 #a8204f;transition:transform .06s}
.bigbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a8204f}
.bigbtn:disabled{background:#4a4866;box-shadow:0 5px 0 #2b2a40;color:#b5b2d4}
.bigbtn.green{background:linear-gradient(#5be38a,var(--green));box-shadow:0 5px 0 var(--greenD)}
.bigbtn.gray{background:#3a3956;box-shadow:0 5px 0 #23223a}
.bigbtn.gray:active{box-shadow:0 1px 0 #23223a}
.bigbtn.blue{background:linear-gradient(#5cc8ff,var(--blue));box-shadow:0 5px 0 var(--blueD)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--panel);border-radius:12px;padding:6px 2px;text-align:center;border:2px solid #0f0e1f;position:relative}
.cell canvas{width:46px;height:46px;display:block;margin:0 auto;background:#e3ebf2;border-radius:10px}
#capC{background:#e3ebf2;border-radius:18px}
.cell .cn{font-size:10px;font-weight:800;line-height:1.15;margin-top:2px;color:#e8e6ff;min-height:23px}
.cell.no canvas{opacity:.35;filter:grayscale(1) brightness(.55)}
.cell.no .cn{color:#77749a}
.cell.eq{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.cell .rar{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:4px}

.shopcard{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px;margin-bottom:8px;border:2px solid #0f0e1f;background:linear-gradient(135deg,#3b2f72,#2a2550)}
.shopcard.offer{background:linear-gradient(135deg,#7a2f9a,#3b2a80);border-color:#f7c948}
.shopcard .ic{width:56px;height:56px;font-size:34px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:0 0 auto}
.shopcard .mid{flex:1}
.shopcard .nm{font-weight:900;font-size:16px}
.shopcard .ds{font-size:12px;color:#d9d4ff;font-weight:600;margin-top:2px;line-height:1.3}
.tag{display:inline-block;font-size:10px;font-weight:900;background:#ff4d8a;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.star{color:#ffd84a}

/* ---------- Modal ---------- */
#modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,15,40,.55);padding:20px}
#modal.open{display:flex}
#modal .box{width:100%;max-width:360px;background:var(--panelD);border:3px solid var(--ink);border-radius:22px;padding:16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal h3{margin:4px 0 8px;font-size:22px;font-weight:900}
#modal p{margin:6px 0;color:#d5d0ff;font-size:14px;font-weight:600;line-height:1.4}
#modal .row{display:flex;gap:8px;margin-top:10px}
#modal .row .bigbtn{flex:1}
#modal .row .bigbtn{margin-top:0}
.reward{font-size:30px;font-weight:900;color:var(--gold);margin:8px 0;display:flex;align-items:center;justify-content:center;gap:8px}
.reward canvas{width:34px;height:34px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.day{border-radius:10px;background:var(--panel);padding:6px 0;font-size:11px;font-weight:800;border:2px solid #0f0e1f}
.day b{display:block;font-size:13px;color:var(--gold)}
.day.done{opacity:.45}
.day.now{border-color:var(--gold);background:#3b3466}
.qrow{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:8px;margin:6px 0;text-align:left}
.qrow .qt{flex:1;font-size:13px;font-weight:800}
.qbar{height:8px;border-radius:4px;background:#14132a;margin-top:5px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#5be38a,#2fbf62);width:0}
.setrow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:800;font-size:14px}
.tgl{width:52px;height:30px;border-radius:15px;background:#4a4866;position:relative;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.tgl.on{background:var(--green)}
.tgl.on::after{left:25px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;text-align:left}
.stats div{background:var(--panel);border-radius:10px;padding:6px 8px;font-size:11px;color:#aaa6d6;font-weight:700}
.stats b{display:block;color:#fff;font-size:14px}

/* ---------- Toasts & hint ---------- */
#toasts{position:absolute;left:0;right:0;top:calc(var(--safe-top) + 150px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:var(--panelD);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:tin .25s ease-out, tout .3s ease-in 2.2s forwards;max-width:88%;text-align:center}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
@keyframes tout{to{transform:translateY(-12px);opacity:0}}
#hint{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;border:3px solid var(--ink);white-space:nowrap;box-shadow:0 3px 0 var(--ink);display:none;z-index:5;max-width:94vw;white-space:normal;text-align:center;width:max-content}
#hint::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--ink)}
#hint.on{display:block}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#adov{position:absolute;inset:0;z-index:60;background:#0b0a18;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
#adov.open{display:flex}
#adov .ring{width:90px;height:90px;border-radius:50%;border:8px solid #3a3956;border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#adov p{color:#cfcaf5;font-weight:700;margin:0}
#adov b{font-size:40px}
#splash{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash h1{margin:0;font-size:34px;font-weight:900}
#splash.off{opacity:0;pointer-events:none}
/* ---------- Трекер задания и эффекты наград ---------- */
#qtrack{pointer-events:auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:15px;background:rgba(36,35,58,.86);border:2px solid var(--ink);color:#fff;font-weight:800;font-size:12px;max-width:94%;box-shadow:0 3px 0 rgba(42,31,74,.35)}
#qtrack .qtt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#qtrack .qtb{width:60px;height:8px;border-radius:4px;background:#14132a;overflow:hidden;flex:0 0 auto}
#qtrack .qtb i{display:block;height:100%;background:linear-gradient(90deg,#5be38a,#2fbf62);transition:width .3s}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="stage">
    <div id="hud">
      <div class="row1">
        <button class="iconbtn" id="btnSettings" aria-label="Настройки"></button>
        <div id="lvlbox"><div id="lvlstar"><span id="lvlnum" class="ol">1</span></div><div id="xpbar"><div id="xpfill"></div><div id="xptext" class="ol-s">0/20</div></div></div>
        <button class="pill" id="gemPill" aria-label="Кристаллы"><span id="gemIco"></span><span id="gems" class="ol-s">0</span><span class="plus">+</span></button>
      </div>
      <div id="money"><div class="amt"><canvas id="moneyIco" width="72" height="72"></canvas><span id="moneyTxt" class="ol-s">$0.00</span><span class="ps" id="psTxt">+$0.00/с</span></div></div>
      <div id="boosts"></div>

        <button class="sidebtn" id="btnInvite"><span class="ol-s">Друзья</span></button>
      </div>
      <div id="sideR">

      <button class="fab" id="btnMinion"><canvas id="minIco" width="80" height="80"></canvas><span class="t ol-s">Миньон</span><span class="price ol-s" id="minP">$0.40</span><span class="lockcap">ур. 3</span></button>

  <nav id="nav">
    <button class="nb" data-tab="shop"><span class="ol-s">Магазин</span></button>
    <button class="nb" data-tab="upgrades"><span class="ol-s">Улучшения</span></button>
    <div id="buywrap">
      <div id="qty"><button data-q="1" class="on">x1</button><button data-q="max">MAX</button></div>
      <button id="buy"><span class="bico"><canvas id="buyIco" width="92" height="92"></canvas></span><span class="bt"><span class="t ol-s" id="buyT">Купить</span><span class="p ol-s" id="buyP">$0.03</span></span></button>
    </div>

  <div id="sheet"><div class="sh-head"><h2 class="ol-s" id="shTitle"></h2><button class="close" id="shClose" aria-label="Закрыть">✕</button></div><div class="sh-body" id="shBody"></div></div>

  <div id="adov"><div class="ring"></div><b class="ol" id="adCount">3</b><p id="adTxt">Реклама (демо-режим)</p></div>

</div>
<script>
// ECONOMY-START
// Единый модуль экономики: его же подключает tools/balance_sim.js
var ECON = (function () {
  // ---------- Монеты ----------
  // Номиналы: 1, 2, 5, 10, 25, 50, 100, 250, 500, 1K ...  (×10 каждые 3 тира)
  function denom(t) {
    if (t < 3) return [1, 2, 5][t];
    var k = t - 3;
    return [10, 25, 50][k % 3] * Math.pow(10, Math.floor(k / 3));
  }
  // палитры: лицевая светлая, лицевая тёмная, гурт, обводка/текст
  var TIERS = [
    ['Медяк',        '#e08a4f', '#9a4a22', '#6e3215', '#5a2810'],
    ['Латунь',       '#ffd65a', '#e09a12', '#a8650a', '#7a4a06'],
    ['Серебро',      '#f2f5fa', '#a9b3c4', '#6f7a8e', '#4a5366'],
    ['Золото',       '#ffe36b', '#f0a800', '#b06d00', '#7a4a00'],
    ['Платина',      '#e9f3ff', '#8fb1d6', '#56779e', '#34506f'],
    ['Нефрит',       '#9df2c0', '#2fb26a', '#1d7a46', '#105030'],
    ['Рубин',        '#ff9aa8', '#e0304a', '#9a1630', '#6a0c1f'],
    ['Сапфир',       '#9cc8ff', '#2f6fe0', '#1b4499', '#0f2b66'],
    ['Аметист',      '#e3b5ff', '#9a45e0', '#652a9e', '#431a6b'],
    ['Изумруд',      '#a6ffd9', '#14b886', '#0b7a58', '#05523a'],
    ['Янтарь',       '#ffd08a', '#e07a10', '#a04f06', '#6e3502'],
    ['Обсидиан',     '#8a8fa8', '#2c2f45', '#16182a', '#0a0b16'],
    ['Опал',         '#fff0ff', '#a6d8ff', '#c08fe0', '#6a4a9a'],
    ['Жемчуг',       '#ffffff', '#f0d8e6', '#c09aae', '#7a5a6e'],
    ['Алмаз',        '#f4ffff', '#9ef0ff', '#4ab8d6', '#20708a'],
    ['Метеорит',     '#c9b8a6', '#6e5a48', '#46362a', '#2a1f17'],
    ['Солнечная',    '#fff6a0', '#ffb300', '#e0601a', '#8a2a00'],
    ['Лунная',       '#eef0ff', '#b8bde6', '#7a7fb8', '#454a80'],
    ['Звёздная',     '#fff4c2', '#ffcf3a', '#c27a00', '#6b3d00'],
    ['Туманность',   '#ffc2f0', '#b04ae0', '#5a2aa8', '#2a1260'],
    ['Пульсар',      '#c2fff6', '#20d0c0', '#0a8090', '#04404a'],
    ['Квазар',       '#ffd2c2', '#ff5a3a', '#a8204a', '#5a0a2a'],
    ['Сингулярность','#d2d6ff', '#4a52ff', '#1a1aa0', '#0a0a50'],
    ['Абсолют',      '#ffffff', '#ffe680', '#ff8ad0', '#8a3aa0']
  ];
  var MAX_TIER = 59;
  var BASE_TIERS = TIERS.length;
  function tierPal(t) { return TIERS[t % BASE_TIERS]; }
  function tierName(t) { var lap = Math.floor(t / BASE_TIERS); return TIERS[t % BASE_TIERS][0] + (lap ? ' ★' + (lap + 1) : ''); }

  // ---------- Зоны (столы) ----------
  var ZONES = [
    { name: 'Кухонный стол',      rim: '#8b5cf6', rimD: '#5b2fc9', felt: '#d6e7f5', feltD: '#b9d3ea', bg: '#e4eef6' },
    { name: 'Барная стойка',      rim: '#c2410c', rimD: '#7c2d12', felt: '#f3dcc2', feltD: '#e2c09b', bg: '#f1e6da' },
    { name: 'Подпольный клуб',    rim: '#0f766e', rimD: '#064e47', felt: '#bfe8d8', feltD: '#93d3bd', bg: '#dceee8' },
    { name: 'Казино «Фортуна»',   rim: '#b91c1c', rimD: '#7f1010', felt: '#2f8f5b', feltD: '#1f6e43', bg: '#e8dede' },
    { name: 'Банковский сейф',    rim: '#475569', rimD: '#1e293b', felt: '#cbd5e1', feltD: '#a5b2c4', bg: '#e2e7ee' },
    { name: 'Королевская казна',  rim: '#ca8a04', rimD: '#854d0e', felt: '#7c1d3f', feltD: '#5c1230', bg: '#f1e9d6' },
    { name: 'Пиратский трюм',     rim: '#78350f', rimD: '#451a03', felt: '#d9b98a', feltD: '#bf9a66', bg: '#e9e0d0' },
    { name: 'Драконье логово',    rim: '#dc2626', rimD: '#7f1d1d', felt: '#3b1f2b', feltD: '#28131d', bg: '#e9dcdc' },
    { name: 'Лунная биржа',       rim: '#6366f1', rimD: '#3730a3', felt: '#1e2350', feltD: '#141838', bg: '#dfe0f2' },
    { name: 'Звёздный монетный двор', rim: '#f59e0b', rimD: '#9a5a00', felt: '#140f2e', feltD: '#0b0820', bg: '#e6e0f0' }
  ];
  function zoneInfo(z) { return ZONES[(z - 1) % ZONES.length]; }
  function zoneName(z) {
    var n = ZONES[(z - 1) % ZONES.length].name;
    var lap = Math.floor((z - 1) / ZONES.length);
    return lap ? n + ' ' + ['', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][Math.min(lap, 9)] : n;
  }
  function zoneMult(z) { return Math.pow(5, z - 1); }
  function zoneCost(z) { return 2000 * Math.pow(650, z - 1); }       // цена перехода z -> z+1
  function capBase(z) { return 6 + (z - 1); }
  function capMax(z) { return Math.min(32, 12 + 2 * (z - 1)); }
  function minionCap(z) { return Math.min(20, 1 + 2 * z); }
  function pressCap(z) { return Math.min(MAX_TIER - 6, 1 + 2 * (z - 1)); }

  // ---------- Покупка монет и миньонов ----------
  var COIN_BASE = 3, COIN_GROW = 1.14, PRESS_PRICE = 1.6;
  function coinPrice(n, spawnTier) { return Math.ceil(COIN_BASE * Math.pow(COIN_GROW, n) * Math.pow(PRESS_PRICE, spawnTier)); }
  function minionPrice(m) { return Math.ceil(40 * Math.pow(2.5, m)); }
  var BASE_CYCLE = 4.0;      // сек на цикл миньона (подход + толчок + отдых)
  var AIR_TIME = 0.95;       // сек монета в воздухе

  // ---------- Улучшения за монеты ----------
  var UPGRADES = [
    { id: 'tap',    name: 'Ловкие пальцы',  icon: '👆', desc: 'Тап подбрасывает и соседние монеты', base: 25, grow: 2.8, max: 8,
      fx: function (L) { return L ? '+' + L + ' соседн. за тап' : 'только одна монета'; } },
    { id: 'speed',  name: 'Бодрые миньоны', icon: '⚡', desc: 'Миньоны переворачивают чаще',    base: 250,   grow: 2.5, max: 20, unlock: 'minions',
      fx: function (L) { return 'цикл ' + (cycleTime(L)).toFixed(2) + ' с'; } },
    { id: 'heads',  name: 'Подкова',        icon: '🍀', desc: 'Шанс выпадения орла',            base: 150,   grow: 2.8,  max: 12,
      fx: function (L) { return Math.round(headsChance(L, 0) * 100) + '% орёл'; } },
    { id: 'mult',   name: 'Позолота',       icon: '🦅', desc: 'Номинал всех монет +25%',        base: 350,  grow: 2.5, max: 200,
      fx: function (L) { return '×' + fmtMul(headsMult(L)) + ' к номиналу'; } },
    { id: 'cap',    name: 'Большой стол',   icon: '🟣', desc: 'Больше места для монет',          base: 50,   grow: 2.1, max: 40, zoneCapped: true,
      fx: function (L, z) { return (capBase(z) + L) + ' мест'; } },
    { id: 'press',  name: 'Монетный пресс', icon: '🔨', desc: 'Покупаемые монеты сразу крупнее', base: 1000, grow: 10,    max: 30, zoneCapped: true,
      fx: function (L) { return 'новые: ' + tierName(L); } },
    { id: 'edge',   name: 'На ребро',       icon: '🪙', desc: 'Шанс, что монета встанет на ребро: ×10 к номиналу', base: 3500, grow: 3.2, max: 14,
      fx: function (L) { return (edgeChance(L) * 100).toFixed(1) + '% ребро'; } },
    { id: 'mint',   name: 'Чеканка',        icon: '⚙️', desc: 'Номинал всех монет ×1.35',        base: 7000, grow: 6,  max: 500,
      fx: function (L) { return '×' + fmtMul(Math.pow(1.35, L)) + ' дохода'; } },
    { id: 'auto',   name: 'Автомерж',       icon: '🔁', desc: 'Пары монет сливаются сами',       base: 4000, grow: 1,    max: 1,
      fx: function (L) { return L ? 'включён' : 'выключен'; } },
    { id: 'safe',   name: 'Сейф',           icon: '🔐', desc: 'Дольше копится офлайн-доход',     base: 6000, grow: 3,    max: 10,
      fx: function (L) { return offlineHours(L) + ' ч офлайн'; } }
  ];
  function upgPrice(u, L) { return Math.ceil(u.base * Math.pow(u.grow, L)); }
  function upgMax(u, z) {
    if (u.id === 'cap') return capMax(z) - capBase(z);
    if (u.id === 'press') return pressCap(z);
    return u.max;
  }

  // ---------- Престиж (Копилка → слитки) ----------
  var BARS_MIN = 5e7;
  function barsFor(runEarned) { return runEarned < BARS_MIN ? 0 : Math.floor(3 * Math.pow(runEarned / BARS_MIN, 0.14)); }
  var PRESTIGE_ZONE = 3;  // копилка открывается, когда в забеге достигнута 3-я зона
  var BAR_BONUS = 0.25;   // +12% дохода за каждый когда-либо полученный слиток
  var PERKS = [
    { id: 'p_mint',  name: 'Монетный двор',    icon: '🏛️', desc: 'Номинал всех монет ×1.5',     base: 3,  grow: 2.6, max: 100 },
    { id: 'p_start', name: 'Наследство',       icon: '👷', desc: '+1 миньон на старте',         base: 3,  grow: 2.6, max: 6 },
    { id: 'p_press', name: 'Фамильный пресс',  icon: '🔨', desc: '+1 уровень пресса на старте', base: 4,  grow: 3.0, max: 4 },
    { id: 'p_luck',  name: 'Счастливая подкова', icon: '🍀', desc: '+2% шанс орла навсегда',   base: 2,  grow: 1.9, max: 10 },
    { id: 'p_gold',  name: 'Золотая жила',     icon: '✨', desc: 'Счастливые монеты чаще и щедрее', base: 3, grow: 2.2, max: 8 },
    { id: 'p_auto',  name: 'Опытная бригада',  icon: '🔁', desc: 'Автомерж сразу после сброса', base: 4,  grow: 1,   max: 1 },
    { id: 'p_zone',  name: 'Связи',            icon: '🗝️', desc: 'Старт со следующей зоны',     base: 12, grow: 5,   max: 4 }
  ];
  function perkPrice(p, L) { return Math.ceil(p.base * Math.pow(p.grow, L)); }

  // ---------- Формулы ----------
  function cycleTime(speedL) { return Math.max(1.0, BASE_CYCLE * Math.pow(0.93, speedL)); }
  function headsChance(L, perkL) { return Math.min(0.85, 0.5 + 0.025 * L + 0.02 * (perkL || 0)); }
  function headsMult(L) { return 1 + 0.25 * L; }   // множитель номинала («Позолота»)
  function edgeChance(L) { return L ? 0.003 + 0.002 * L : 0; }
  var EDGE_MULT = 10;
  function offlineHours(L) { return 1 + L; }
  function tapMult(L) { return 1 + 0.5 * L; }   // оценка для симуляции: тап + соседние монеты
  // ожидание выплаты за один переворот (в долях номинала)
  function expectedFlip(headsL, perkLuck, multL, edgeL) {
    var pe = edgeChance(edgeL), ph = headsChance(headsL, perkLuck);
    return ((1 - pe) * ph + pe * EDGE_MULT) * headsMult(multL);
  }

  // Миньоны раскидываются по всем монетам стола; крупные монеты чуть привлекательнее.
  // Модель (для офлайна и симуляции): поток бросков делится пропорционально весам,
  // но одну монету нельзя подбросить чаще, чем раз в AIR_TIME + 0.15 с.
  var TIER_PULL = 0.15;
  function tierWeight(t, tmin) { return 1 + TIER_PULL * (t - tmin); }
  function minionFlipValue(tiers, rate) {
    if (!tiers.length || rate <= 0) return 0;
    var per = 1 / (AIR_TIME + 0.15), tmin = Math.min.apply(null, tiers);
    var open = tiers.map(function (t) { return { t: t, w: tierWeight(t, tmin), r: 0 }; }), left = rate, sum = 0;
    for (var it = 0; it < 6 && left > 1e-9 && open.length; it++) {
      var W = open.reduce(function (a, o) { return a + o.w; }, 0), next = [], used = 0;
      open.forEach(function (o) { var add = left * o.w / W; if (o.r + add >= per) { used += per - o.r; o.r = per; sum += per * denom(o.t); } else { o.r += add; used += add; next.push(o); } });
      left -= used; open = next;
    }
    open.forEach(function (o) { sum += o.r * denom(o.t); });
    return sum;
  }

  // Уровень игрока
  function xpNeed(lvl) { return Math.floor(20 * Math.pow(lvl, 1.75)); }
  function levelGems(lvl) { return 3 + Math.floor(lvl / 5) * 2; }

  // Капсулы со шляпами (жетоны за решку)
  function capsulePrice(k) { return Math.floor(20 * Math.pow(1.22, k)); }
  var HAT_BONUS = 0.03;

  // ---------- Формат чисел ----------
  var SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  function fmt(n) {
    if (!isFinite(n)) return '∞';

  ['journey','sets'].forEach(function(k){ if (!S.content[k] || typeof S.content[k] !== 'object' || Array.isArray(S.content[k])) S.content[k] = {}; });
  S.content.version = CONTENT_VERSION;
  S.content.peakMinions = Math.max(Number.isFinite(S.content.peakMinions) ? S.content.peakMinions : 0, R().minions || 0);
}
function journeyValue(q) {
  if (q.metric === 'zone') return S.maxZoneEver;
  if (q.metric === 'tier') return maxDisc();
  if (q.metric === 'minions') return S.content.peakMinions;
  if (q.metric === 'capsules') return S.capsules;
  return S.stats[q.metric] || 0;
}
function currentJourney() { ensureContent(); return JOURNEY.filter(function(q){return !S.content.journey[q.id];})[0] || null; }

}

var fmt = ECON.fmt;
// Деньги хранятся в центах. Счётчики и цены — в долларах, номинал монет — ¢ до доллара, дальше $.
function fmtMoney(c) {
  if (c < 0) return '-' + fmtMoney(-c);
  var d = c / 100;
  if (d < 100) return '$' + d.toFixed(2);
  if (d < 1000) return '$' + Math.floor(d);
  return '$' + fmt(d);
}
function fmtCoin(c) { return c < 99.5 ? Math.round(c) + '¢' : '$' + fmt(c / 100); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function now() { return Date.now(); }
function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function mmss(s) { s = Math.max(0, Math.ceil(s)); var m = Math.floor(s / 60); return m >= 60 ? Math.floor(m / 60) + 'ч ' + (m % 60) + 'м' : m + ':' + String(s % 60).padStart(2, '0'); }
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function newRunState(perks) {
  perks = perks || {};
  var z = 1 + (perks.p_zone || 0);
  var upg = {};
  if (perks.p_press) upg.press = Math.min(perks.p_press, ECON.pressCap(z));
  if (perks.p_auto) upg.auto = 1;
  var t0 = upg.press || 0;
  return { zone: z, bought: 0, minions: perks.p_start || 0, upg: upg, coins: [t0, t0], earned: 0, started: now() };
}
function defaultState() {
  return {
    v: 1, money: 0, gems: 10, tokens: 0, bars: 0, barsTotal: 0, lvl: 1, xp: 0,
    content: { version: CONTENT_VERSION, journey: {}, sets: {}, peakMinions: 0 },
    run: newRunState({}), perks: {}, maxZoneEver: 1,
    hats: { 0: 1 }, hatEq: -1, capsules: 0, disc: { 0: 1 },
    stats: { flips: 0, heads: 0, edges: 0, merges: 0, taps: 0, total: 0, play: 0, prestiges: 0, lucky: 0, bought: 0 },
    daily: { last: '', streak: 0, club: '' }, quests: { day: '', list: [] },
    boostUntil: 0, hires: [], purchases: {}, clubUntil: 0, ads: { day: '', n: 0 },

  };
}
var S = defaultState();
function R() { return S.run; }
function L(id) { return S.run.upg[id] || 0; }

// ---------- Производные величины ----------
function capacity() { return ECON.capBase(R().zone) + L('cap'); }
function cycleTime() { return ECON.cycleTime(L('speed')); }
function hatsOwnedBonus() { var n = 0; for (var k in S.hats) if (S.hats[k] && +k !== DEFAULT_HAT) n++; return n; }
function discCount() { var n = 0; for (var k in S.disc) if (S.disc[k]) n++; return n; }
var frenzyUntil = 0;
function baseMult() {
  return ECON.zoneMult(R().zone) * (1 + ECON.BAR_BONUS * S.barsTotal) * Math.pow(1.35, L('mint')) * Math.pow(1.5, P('p_mint'))
    * (1 + 0.02 * discCount()) * (1 + ECON.HAT_BONUS * hatsOwnedBonus()) * (S.purchases.x2forever ? 2 : 1);
}
// Текущий номинал монеты: базовое значение × все множители. Ровно столько монета и приносит.
function valueMult() { return baseMult() * boostMult() * ECON.headsMult(L('mult')); }
// Номинал всегда «круглый»: 1–9, затем 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100…
var NICE = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
function roundNom(v) {
  if (v < 9.5) return Math.max(1, Math.round(v));
  var e = Math.pow(10, Math.floor(Math.log10(v))), m = Math.log(v / e), best = 1, bd = 9;
  for (var i = 0; i < NICE.length; i++) { var d = Math.abs(Math.log(NICE[i]) - m); if (d < bd) { bd = d; best = NICE[i]; } }
  return best * e;
}
function coinValue(tier) { return roundNom(ECON.denom(tier) * world.vm); }
function boostMult() { return (S.boostUntil > now() ? 2 : 1) * (frenzyUntil > now() ? 7 : 1); }
function headsP() { return ECON.headsChance(L('heads'), P('p_luck')); }
function edgeP() { return ECON.edgeChance(L('edge')); }
// Ожидаемый доход в секунду от миньонов (для офлайна и прогресса)
function idleIncome(minionCount) {
  var coins = world.coins.length ? world.coins.map(function (c) { return c.tier; }) : R().coins.slice();
  var inc = ECON.minionFlipValue(coins, (minionCount === undefined ? R().minions + extraMinions() : minionCount) / cycleTime());
  return inc * ECON.expectedFlip(L('heads'), P('p_luck'), L('mult'), L('edge')) * baseMult();
}
function pendingBars() { return S.maxZoneThisRun >= ECON.PRESTIGE_ZONE || R().zone >= ECON.PRESTIGE_ZONE ? ECON.barsFor(R().earned) : 0; }
function unlocked(f) { return S.lvl >= (UNLOCKS[f] || 0); }
function prestigeUnlocked() { return S.maxZoneEver >= ECON.PRESTIGE_ZONE || S.stats.prestiges > 0; }

// ---------- Сохранение ----------
function serialize() {
  ensureContent();
  S.run.coins = world.coins.map(function (c) { return c.tier; });
  S.lastSeen = now(); S.savedAt = now();
  return JSON.stringify(S);
}
function mergeLoaded(o) {
  var d = defaultState();
  for (var k in d) if (o[k] === undefined) o[k] = d[k];
  for (var k2 in d.stats) if (o.stats[k2] === undefined) o.stats[k2] = 0;
  for (var k3 in d.settings) if (o.settings[k3] === undefined) o.settings[k3] = d.settings[k3];
  return o;
}
function saveLocal() { try { localStorage.setItem(CONFIG.SAVE_KEY, serialize()); } catch (e) { } }
function loadLocal() { try { var s = localStorage.getItem(CONFIG.SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
var lastCloud = 0;
function saveAll(force) {
  var data = serialize();
  try { localStorage.setItem(CONFIG.SAVE_KEY, data); } catch (e) { }
  if (TGB.cloud && (force || now() - lastCloud > 45000)) { lastCloud = now(); TGB.cloudSave(data); }
}

// ---------- Telegram bridge ----------
var TGB = (function () {
  var w = window.Telegram && window.Telegram.WebApp;
  var inTG = !!(w && w.initData);
  var api = {
    inTG: inTG, wa: inTG ? w : null, cloud: !!(inTG && w.CloudStorage && w.isVersionAtLeast && w.isVersionAtLeast('6.9')),
    user: inTG && w.initDataUnsafe ? w.initDataUnsafe.user : null,
    startParam: inTG && w.initDataUnsafe ? w.initDataUnsafe.start_param : null
  };
  api.init = function () {
    if (!inTG) return;
    try { w.expand(); } catch (e) { }
    try { if (w.disableVerticalSwipes) w.disableVerticalSwipes(); } catch (e) { }
    try { if (w.isVersionAtLeast('6.1')) { w.setHeaderColor('#e4eef6'); w.setBackgroundColor('#e4eef6'); } } catch (e) { }
    try { if (w.setBottomBarColor) w.setBottomBarColor('#16152a'); } catch (e) { }
    w.onEvent('viewportChanged', function (event) { if(!event || event.isStateStable) scheduleResize(); });
    ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'].forEach(function(name){w.onEvent(name,scheduleResize);});
    try { if(w.SettingsButton && w.isVersionAtLeast('7.0')){w.SettingsButton.onClick(showSettings);w.SettingsButton.show();} } catch(e){}
    if (w.BackButton) w.BackButton.onClick(function () { closeAll(); });
  };
  api.back = function (show) { if (!inTG || !w.BackButton || !w.isVersionAtLeast('6.1')) return; show ? w.BackButton.show() : w.BackButton.hide(); };
  api.haptic = function (kind) {
    if (!S.settings.haptic) return;
    if (inTG && w.HapticFeedback && w.isVersionAtLeast('6.1')) {
      try {
        if (kind === 'success' || kind === 'error' || kind === 'warning') w.HapticFeedback.notificationOccurred(kind);
        else if (kind === 'select') w.HapticFeedback.selectionChanged();
        else w.HapticFeedback.impactOccurred(kind || 'light');
      } catch (e) { }
    } else if (navigator.vibrate) { try { navigator.vibrate(kind === 'heavy' || kind === 'success' ? 18 : 6); } catch (e) { } }
  };
  // CloudStorage: значение до 4096 символов — режем на куски
  api.cloudSave = function (data) {
    if (!api.cloud) return;
    var parts = [], CH = 3900;
    for (var i = 0; i < data.length; i += CH) parts.push(data.slice(i, i + CH));
    parts.forEach(function (p, i) { w.CloudStorage.setItem('s' + i, p); });
    w.CloudStorage.setItem('sn', String(parts.length));
  };
  api.cloudLoad = function (cb) {
    if (!api.cloud) return cb(null);
    var done = false; setTimeout(function () { if (!done) { done = true; cb(null); } }, 2500);
    w.CloudStorage.getItem('sn', function (err, n) {
      if (err || !n) { if (!done) { done = true; cb(null); } return; }
      var keys = []; for (var i = 0; i < +n; i++) keys.push('s' + i);
      w.CloudStorage.getItems(keys, function (e2, vals) {
        if (done) return; done = true;
        if (e2 || !vals) return cb(null);
        try { cb(JSON.parse(keys.map(function (k) { return vals[k] || ''; }).join(''))); } catch (e) { cb(null); }
      });
    });
  };
  api.share = function (text) {
    var uid = api.user ? api.user.id : 'web';
    var link = 'https://t.me/' + CONFIG.BOT_USERNAME + (CONFIG.APP_SHORT_NAME ? '/' + CONFIG.APP_SHORT_NAME : '') + '?startapp=ref_' + uid;
    var url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);
    if (inTG) w.openTelegramLink(url);
    else { try { navigator.clipboard.writeText(link); toast('Ссылка скопирована'); } catch (e) { toast(link); } }
  };
  api.call = function (path, body) {
    if(CONFIG.STANDALONE) return Promise.reject(new Error('Server features are disabled'));
    return fetch(CONFIG.API_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Init-Data': inTG ? w.initData : '' },
      body: JSON.stringify(body || {})
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  };
  return api;
})();

// ---------- Звук (WebAudio, синтез) ----------

  var ctx = null, last = 0;
  function ensure() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; }

function gemBuy(it) {
  if (S.gems < it.cost) return;
  S.gems -= it.cost;
  if (it.id === 'boost30') { S.boostUntil = Math.max(S.boostUntil, now()) + 30 * 60e3; toast('Буст ×2 на 30 минут'); }
  else if (it.id === 'warp2') { var v = Math.max(100, idleIncome() * 7200); earn(v); toast('Машина времени: +' + fmtMoney(v)); burst(T.cx, T.cy, 40, ['#ffd23f', '#fff'], 2); }
  else if (it.id === 'tok50') { S.tokens += 50; toast('+50 жетонов'); }
  else if (it.id === 'hire') {
    if (activeHires() >= 3) { S.gems += it.cost; toast('Уже работают 3 наёмника'); return; }
    S.hires.push(now() + 2 * 3600e3); syncExtras(); toast('Наёмник вышел на смену на 2 часа');
  }
  else if (it.id === 'lucky') { world.lucky = null; spawnLucky(); closeAll(); toast('Лови счастливую монету!'); }
  Sound.play('buy'); TGB.haptic('success'); refreshUI(true); saveAll();
}

function closeModal() {
  $('modal').classList.remove('open'); modalLocked = false; $('mBox').dataset.kind = '';

function showQuests(soft) {
  ensureQuests();
  var html = '<h3 class="ol-s">Задания</h3><p style="font-size:12px;margin-top:0">Выполненное задание сразу сменяется новым. Выполнено всего: <b>' + (S.quests.done || 0) + '</b></p>';
  S.quests.list.forEach(function (q, i) {
    if (!q) { html += '<div class="qrow qwait"><div class="qt">Новое задание…</div></div>'; return; }
    var done = q.p >= q.goal, fresh = now() - (q.born || 0) < 900;
    html += '<div class="qrow' + (done ? ' qdone' : '') + (fresh ? ' qnew' : '') + '"><div style="flex:1"><div class="qt">' + q.t + '</div><div class="qbar"><i style="width:' + (q.p / q.goal * 100) + '%"></i></div><div class="qrw">Награда: ' + rewardLabel(q) + '</div></div>' +
      '<button class="buyb ' + (done ? 'green' : 'blue') + '" data-q="' + i + '"' + (done ? '' : ' disabled') + '>' + (done ? 'Забрать' : (q.id === 'earn' ? fmtMoney(q.p) + '/' + fmtMoney(q.goal) : q.p + '/' + q.goal)) + '</button></div>';
  });
  var canSkip = now() > (S.quests.skipAt || 0);
  html += '<button class="bigbtn gray" id="qSkip"' + (canSkip ? '' : ' disabled') + '>' + (canSkip ? 'Заменить самое долгое задание' : 'Замена через ' + mmss((S.quests.skipAt - now()) / 1000)) + '</button><button class="bigbtn gray" onclick="closeModal()">Закрыть</button>';
  if (soft && $('modal').classList.contains('open')) { $('mBox').innerHTML = html; } else modal(html);
  $('mBox').dataset.kind = 'quests';
  document.querySelectorAll('#mBox [data-q]').forEach(function (b) { b.onclick = function () { claimQuest(+b.dataset.q, b); }; });
  $('qSkip').onclick = function () {
    if (now() < (S.quests.skipAt || 0)) return;
    var worst = -1, wp = 2; S.quests.list.forEach(function (q, i) { if (q && q.p < q.goal && q.p / q.goal < wp) { wp = q.p / q.goal; worst = i; } });
    if (worst < 0) return;
    S.quests.list[worst] = newQuest(); S.quests.skipAt = now() + 10 * 60e3; showQuests(true); saveAll();
  };
}

  $('bOk').onclick = function () { closeModal(); Ads.show(function () { S.boostUntil = Math.max(S.boostUntil, now()) + 15 * 60e3; toast('×2 доход на 15 минут'); Sound.play('level'); refreshUI(true); }); };

  var st = S.stats;

    $('rOk').onclick = function () { var keep = S.purchases, club = S.clubUntil; S = defaultState(); S.purchases = keep; S.clubUntil = club; rebuildWorld(); applyTheme(); saveAll(true); closeModal(); refreshUI(true); };

// Integrate temporary workers only over the part of the absence they were hired for.
function offlineValue(sec, hires) {
  var cap = (ECON.offlineHours(L('safe')) + (hasClub() ? 4 : 0)) * 3600;
  var start = now() - sec * 1000, end = start + Math.min(sec,cap) * 1000;
  var expiries = (hires || S.hires || []).filter(function(t){return Number.isFinite(t) && t > start;});
  var points = [start,end].concat(expiries.filter(function(t){return t < end;})).sort(function(a,b){return a-b;});
  var value = 0, permanent = R().minions + (S.purchases.starter ? 1 : 0);
  for (var i=1;i<points.length;i++) {
    var count = expiries.filter(function(t){return t > points[i-1];}).length;
    value += idleIncome(permanent+count) * (points[i]-points[i-1]) / 1000;
  }
  return value * (hasClub() ? 1.5 : 1);
}
function showOffline(sec, hires) {
  var cap = (ECON.offlineHours(L('safe')) + (hasClub() ? 4 : 0)) * 3600;
  var v = offlineValue(sec, hires);
  if (v < 1) return;
  modal('<h3 class="ol-s">С возвращением!</h3><p>Пока тебя не было ' + mmss(sec) + (sec > cap ? ' (сейф копит до ' + Math.round(cap / 3600) + ' ч)' : '') + ', бригада заработала:</p>' +
    '<div class="reward">' + cashImg(34) + fmtMoney(v) + '</div>' +
    '<div class="row"><button class="bigbtn gray" id="oTake">Забрать</button>' + (CONFIG.STANDALONE ? '' : '<button class="bigbtn green" id="oX2">' + (vip() ? '×2 сразу' : '×2 за рекламу') + '</button>') + '</div>', true);
  $('oTake').onclick = function () { earn(v); saveAll(true); closeModal(); refreshUI(true); };
  if($('oX2')) $('oX2').onclick = function () { closeModal(); Ads.show(function () { earn(v * 2); toast('+' + fmtMoney(v * 2)); refreshUI(true); }); setTimeout(function () { if (!$('modal').classList.contains('open') && !Ads.busy) { } }, 0); };
}

function applyTheme() {
  var z = ECON.zoneInfo(R().zone);
  var fc = floorColors();
  $('app').style.background = fc.mid;
  document.body.style.background = fc.mid;
  if (TGB.inTG) { try { TGB.wa.setHeaderColor(fc.top); TGB.wa.setBackgroundColor(fc.top); } catch (e) { } }
  tableCache = null;
}

/* =========================================================================
   Запуск
   ========================================================================= */
function boot(loaded) {
  if (loaded) S = mergeLoaded(loaded);
  ensureContent();
  var offlineHires = (S.hires || []).slice();
  if (!S.maxZoneThisRun) S.maxZoneThisRun = R().zone;
  qtyMax = !!S.qtyMax;
  document.querySelectorAll('#qty button').forEach(function (x) { x.classList.toggle('on', (x.dataset.q === 'max') === qtyMax); });
  // реферал: start_param = ref_<id> (награду начисляет сервер)
  if (TGB.startParam && !S.ref) S.ref = TGB.startParam;
  applyTheme();
  resize();
  rebuildWorld();
  ensureQuests();
  minionIcon($('minIco'), pickHat());
  refreshUI(true);
  var away = (now() - (S.lastSeen || now())) / 1000;
  if (loaded && away > 60) showOffline(away, offlineHires);
  if (TGB.inTG && !CONFIG.STANDALONE) { TGB.call('/api/hello', { ref: S.ref }).catch(function () { }); Pay.claim(); }
  if(TGB.inTG){try{TGB.wa.ready();}catch(e){}}
  requestAnimationFrame(loop);
  setTimeout(function () { $('splash').classList.add('off'); }, 250);
}
var hiddenAt = 0, hiddenHires = [];
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { hiddenAt = now(); hiddenHires = S.hires.slice(); saveAll(true); }
  else if (hiddenAt) { var away = (now() - hiddenAt) / 1000; hiddenAt = 0; lastT = 0; if (away > 60) showOffline(away, hiddenHires); }
});
window.addEventListener('pagehide', function () { saveAll(true); });
window.addEventListener('resize', scheduleResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',scheduleResize);
if(window.ResizeObserver){var layoutObserver=new ResizeObserver(scheduleResize);layoutObserver.observe($('nav'));layoutObserver.observe($('hud'));}

setupStaticUI();
TGB.init();
Ads.init();
(function start() {
  var local = loadLocal();
  var go = function (cloud) {
    var pick = local;
    if (cloud && (!local || (cloud.savedAt || 0) > (local.savedAt || 0))) pick = cloud;
    var start = function () { boot(pick); };
    if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('900 20px Rubik'), new Promise(function (r) { setTimeout(r, 1200); })]).then(start, start);
    else start();
  };
  if (TGB.cloud) TGB.cloudLoad(go); else go(null);
})();
