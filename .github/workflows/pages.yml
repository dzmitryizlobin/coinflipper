name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check game scripts
        run: node tools/analyze.cjs
      - name: Build standalone Telegram game
        run: node tools/build-telegram.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: telegram

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
